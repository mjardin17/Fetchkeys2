services:
  bosskey:
    build:
      context: ../..
      dockerfile: artifacts/bosskey-private/Dockerfile
    container_name: bosskey-private
    ports:
      - "127.0.0.1:4789:4789"
    environment:
      HOST: "0.0.0.0"
      PORT: "4789"
      DATA_DIR: "/data"
      TELEMETRY_ENABLED: "false"
    volumes:
      - bosskey-private-data:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  bosskey-private-data: